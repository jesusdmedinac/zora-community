<!-- Lightweight Audio-Tactile Feedback Interaction Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const ignitionBtn = document.getElementById('ignitionBtn');
      if (ignitionBtn) {
        ignitionBtn.addEventListener('click', () => {
          // Micro-interaction state change
          const originalContent = ignitionBtn.innerHTML;
          ignitionBtn.innerHTML = `
            <span class="material-symbols-outlined text-lg text-white animate-spin" data-icon="sync">sync</span>
            <span class="text-white tracking-widest font-black">COCKPIT ENGAGED...</span>
          `;
          ignitionBtn.classList.add('ring-2', 'ring-primary', 'ring-offset-2', 'ring-offset-surface-container-lowest');
          
          setTimeout(() => {
            ignitionBtn.innerHTML = `
              <span class="material-symbols-outlined text-lg text-white" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
              <span class="text-white tracking-widest font-black">SYSTEM ARMED</span>
            `;
            setTimeout(() => {
              ignitionBtn.innerHTML = originalContent;
              ignitionBtn.classList.remove('ring-2', 'ring-primary', 'ring-offset-2', 'ring-offset-surface-container-lowest');
            }, 1800);
          }, 800);
        });
      }
    });
  </script>
