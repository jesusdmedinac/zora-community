<svg width="2200" height="1400" viewBox="0 0 2200 1400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#894CFF"/>
      <stop offset="50%" stop-color="#A833FD"/>
      <stop offset="100%" stop-color="#EC168A"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: 'Inter', -apple-system, sans-serif; font-size: 32px; font-weight: 800; fill: #E3E2E6; letter-spacing: -0.5px; }
      .subtitle { font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; font-weight: 500; fill: #A3AAC4; }
      .section-hdr { font-family: 'Inter', -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #D1BCFF; }
      .token-name { font-family: 'Inter', -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #E3E2E6; }
      .token-hex { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; fill: #A3AAC4; }
      .badge-text { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; font-weight: 700; }
      .cta-text { font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="2200" height="1400" fill="#0D0E11"/>

  <!-- Header Banner -->
  <g transform="translate(60, 50)">
    <rect width="2080" height="100" rx="16" fill="#12151C" stroke="#4A4455" stroke-opacity="0.3"/>
    <circle cx="50" cy="50" r="24" fill="url(#brandGradient)"/>
    <text x="90" y="45" class="title">ZORA M3 AUTOMOTIVE DESIGN SYSTEM</text>
    <text x="90" y="70" class="subtitle">Material 3 Expressive System &bull; Dark Titanium &bull; Copilot Telemetry &bull; zora-community</text>
  </g>

  <!-- ===================================================================== -->
  <!-- COLUMNA 1: PALETA TONAL M3 (X=60, Y=180, W=700)                      -->
  <!-- ===================================================================== -->
  <g transform="translate(60, 180)">
    <rect width="680" height="1160" rx="20" fill="#12151C" stroke="#4A4455" stroke-opacity="0.3"/>
    <text x="32" y="44" class="section-hdr">1. PALETA TONAL (MATERIAL 3 DARK THEME)</text>

    <!-- Color Swatches Grid -->
    <!-- Row 1: Primary & Primary Container -->
    <g transform="translate(32, 70)">
      <rect width="140" height="70" rx="10" fill="#D1BCFF"/>
      <text x="0" y="92" class="token-name">Primary</text>
      <text x="0" y="108" class="token-hex">#D1BCFF</text>
    </g>
    <g transform="translate(192, 70)">
      <rect width="140" height="70" rx="10" fill="#894CFF"/>
      <text x="0" y="92" class="token-name">Primary Container</text>
      <text x="0" y="108" class="token-hex">#894CFF</text>
    </g>
    <g transform="translate(352, 70)">
      <rect width="140" height="70" rx="10" fill="#E1B6FF"/>
      <text x="0" y="92" class="token-name">Secondary</text>
      <text x="0" y="108" class="token-hex">#E1B6FF</text>
    </g>
    <g transform="translate(512, 70)">
      <rect width="140" height="70" rx="10" fill="#EC168A"/>
      <text x="0" y="92" class="token-name">Tertiary / Neon</text>
      <text x="0" y="108" class="token-hex">#EC168A</text>
    </g>

    <!-- Row 2: Surface Tokens -->
    <g transform="translate(32, 210)">
      <rect width="140" height="70" rx="10" fill="#0D0E11" stroke="#4A4455" stroke-opacity="0.5"/>
      <text x="0" y="92" class="token-name">Surface Canvas</text>
      <text x="0" y="108" class="token-hex">#0D0E11</text>
    </g>
    <g transform="translate(192, 210)">
      <rect width="140" height="70" rx="10" fill="#12151C" stroke="#4A4455" stroke-opacity="0.5"/>
      <text x="0" y="92" class="token-name">Surface Low</text>
      <text x="0" y="108" class="token-hex">#12151C</text>
    </g>
    <g transform="translate(352, 210)">
      <rect width="140" height="70" rx="10" fill="#1B1B1F" stroke="#4A4455" stroke-opacity="0.5"/>
      <text x="0" y="92" class="token-name">Surface Container</text>
      <text x="0" y="108" class="token-hex">#1B1B1F</text>
    </g>
    <g transform="translate(512, 210)">
      <rect width="140" height="70" rx="10" fill="#25262B" stroke="#4A4455" stroke-opacity="0.5"/>
      <text x="0" y="92" class="token-name">Surface High</text>
      <text x="0" y="108" class="token-hex">#25262B</text>
    </g>

    <!-- Row 3: Semántica Automotriz -->
    <g transform="translate(32, 350)">
      <rect width="180" height="60" rx="10" fill="#10B981"/>
      <text x="0" y="82" class="token-name">Direct Fit / Óptimo</text>
      <text x="0" y="98" class="token-hex">#10B981 (Success)</text>
    </g>
    <g transform="translate(242, 350)">
      <rect width="180" height="60" rx="10" fill="#F59E0B"/>
      <text x="0" y="82" class="token-name">Advertencia / Servicio</text>
      <text x="0" y="98" class="token-hex">#F59E0B (Warning)</text>
    </g>
    <g transform="translate(452, 350)">
      <rect width="180" height="60" rx="10" fill="#EF4444"/>
      <text x="0" y="82" class="token-name">Falla Crítica / Radar</text>
      <text x="0" y="98" class="token-hex">#EF4444 (Error)</text>
    </g>

    <!-- Row 4: Escala de Formas (Shape Tokens) -->
    <text x="32" y="490" class="section-hdr">ESCALA DE FORMAS Y ELEVACIÓN</text>
    
    <g transform="translate(32, 520)">
      <rect width="280" height="48" rx="24" fill="#1B1B1F" stroke="#4A4455" stroke-opacity="0.4"/>
      <text x="20" y="28" class="token-name">Capsule (Pills / CTA) &bull; 9999px</text>
    </g>
    <g transform="translate(340, 520)">
      <rect width="280" height="48" rx="16" fill="#1B1B1F" stroke="#4A4455" stroke-opacity="0.4"/>
      <text x="20" y="28" class="token-name">Large Card (Hero) &bull; 16px</text>
    </g>
    <g transform="translate(32, 590)">
      <rect width="280" height="48" rx="12" fill="#1B1B1F" stroke="#4A4455" stroke-opacity="0.4"/>
      <text x="20" y="28" class="token-name">Standard Card (Parts) &bull; 12px</text>
    </g>
    <g transform="translate(340, 590)">
      <rect width="280" height="48" rx="8" fill="#1B1B1F" stroke="#4A4455" stroke-opacity="0.4"/>
      <text x="20" y="28" class="token-name">Micro Chip (Tags/VIN) &bull; 8px</text>
    </g>

    <!-- Row 5: Tipografía de Autoridad -->
    <text x="32" y="680" class="section-hdr">TRÍO TIPOGRÁFICO DE AUTORIDAD</text>
    <g transform="translate(32, 710)">
      <text x="0" y="24" style="font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 800; fill: #E3E2E6;">Manrope (Bold / Display)</text>
      <text x="0" y="48" class="subtitle">Titulares geométricos, impacto tecnológico y presencia institucional.</text>
      
      <text x="0" y="94" style="font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 400; fill: #E3E2E6;">Inter (Body &amp; UI Controls)</text>
      <text x="0" y="118" class="subtitle">Texto continuo de alta legibilidad en cabina y pantallas nocturnas.</text>
      
      <text x="0" y="164" style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; fill: #D1BCFF;">JetBrains Mono (OEM / Telemetry)</text>
      <text x="0" y="188" class="subtitle">Códigos de parte, números VIN, lecturas de OBD-II y especificaciones.</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- COLUMNA 2: MASTER COMPONENTS (X=780, Y=180, W=680)                    -->
  <!-- ===================================================================== -->
  <g transform="translate(780, 180)">
    <rect width="680" height="1160" rx="20" fill="#12151C" stroke="#4A4455" stroke-opacity="0.3"/>
    <text x="32" y="44" class="section-hdr">2. COMPONENTES MAESTROS ZORA M3</text>

    <!-- Component 1: TopAppBar -->
    <g transform="translate(32, 70)">
      <rect width="616" height="64" rx="14" fill="#1B1B1F" stroke="#4A4455" stroke-opacity="0.3"/>
      <!-- Menu Button -->
      <rect x="16" y="14" width="36" height="36" rx="8" fill="#25262B"/>
      <path d="M24 26H44M24 32H44M24 38H44" stroke="#E3E2E6" stroke-width="2" stroke-linecap="round"/>
      <!-- Model Selector Pill -->
      <g transform="translate(180, 14)">
        <rect width="250" height="36" rx="18" fill="#25262B" stroke="#894CFF" stroke-opacity="0.5"/>
        <circle cx="20" cy="18" r="5" fill="#10B981"/>
        <text x="34" y="23" style="font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; fill: #E3E2E6;">⚡ Gemini 3.8 Flash &bull; Copilot</text>
      </g>
      <!-- User Avatar -->
      <circle cx="580" cy="32" r="18" fill="url(#brandGradient)"/>
      <circle cx="580" cy="32" r="16" fill="#12151C"/>
      <text x="574" y="37" style="font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; fill: #D1BCFF;">JD</text>
    </g>

    <!-- Component 2: Glow CTA Button -->
    <g transform="translate(32, 170)">
      <rect width="616" height="56" rx="28" fill="url(#brandGradient)" filter="url(#glowFilter)" opacity="0.3"/>
      <rect width="616" height="56" rx="28" fill="url(#brandGradient)"/>
      <text x="180" y="34" class="cta-text">&#9889; ACTIVAR ZORA PRO COPILOT</text>
    </g>

    <!-- Component 3: 30-Sec Diagnostic Telemetry Widget -->
    <g transform="translate(32, 260)">
      <rect width="616" height="210" rx="16" fill="#1B1B1F" stroke="#4A4455" stroke-opacity="0.3"/>
      <text x="24" y="34" style="font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700; fill: #E3E2E6;">DIAGNÓSTICO RÁPIDO (30-SEC CHECK-IN)</text>
      <text x="490" y="34" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; fill: #10B981;">TELEMETRÍA OK</text>

      <!-- Meter 1: Aceite -->
      <g transform="translate(24, 55)">
        <text x="0" y="16" class="token-name">Nivel de Aceite (5W-30 Sintético)</text>
        <text x="510" y="16" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #10B981;">94% Óptimo</text>
        <rect y="26" width="568" height="8" rx="4" fill="#25262B"/>
        <rect y="26" width="534" height="8" rx="4" fill="#10B981"/>
      </g>

      <!-- Meter 2: Presión Llantas -->
      <g transform="translate(24, 105)">
        <text x="0" y="16" class="token-name">Presión de Neumáticos (PSI)</text>
        <text x="520" y="16" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #10B981;">32 PSI OK</text>
        <rect y="26" width="568" height="8" rx="4" fill="#25262B"/>
        <rect y="26" width="500" height="8" rx="4" fill="#10B981"/>
      </g>

      <!-- Meter 3: Refrigerante -->
      <g transform="translate(24, 155)">
        <text x="0" y="16" class="token-name">Nivel de Refrigerante</text>
        <text x="490" y="16" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #F59E0B;">Revisar en 2 sem</text>
        <rect y="26" width="568" height="8" rx="4" fill="#25262B"/>
        <rect y="26" width="380" height="8" rx="4" fill="#F59E0B"/>
      </g>
    </g>

    <!-- Component 4: Copilot Memory Vault Card -->
    <g transform="translate(32, 500)">
      <rect width="616" height="180" rx="16" fill="#1B1B1F" stroke="#4A4455" stroke-opacity="0.3"/>
      <text x="24" y="34" style="font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700; fill: #E3E2E6;">COPILOT MEMORY VAULT (LOCAL-FIRST)</text>
      <text x="500" y="34" style="font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; fill: #D1BCFF;">3/3 Ranuras</text>

      <!-- Memory item 1 -->
      <g transform="translate(24, 55)">
        <rect width="568" height="48" rx="10" fill="#25262B"/>
        <circle cx="24" cy="24" r="6" fill="#894CFF"/>
        <text x="44" y="29" class="token-name">Bujías NGK Laser Iridium instaladas a 81,000 km</text>
      </g>
      <!-- Memory item 2 -->
      <g transform="translate(24, 115)">
        <rect width="568" height="48" rx="10" fill="#25262B"/>
        <circle cx="24" cy="24" r="6" fill="#894CFF"/>
        <text x="44" y="29" class="token-name">Batería LTH 12V cambiada en Noviembre 2025</text>
      </g>
    </g>

    <!-- Component 5: Conversational Chat Bubbles -->
    <g transform="translate(32, 710)">
      <rect width="616" height="220" rx="16" fill="#1B1B1F" stroke="#4A4455" stroke-opacity="0.3"/>
      <text x="24" y="34" style="font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700; fill: #E3E2E6;">BURBUJAS CONVERSACIONALES DEL COPILOT</text>

      <!-- Copilot Bubble -->
      <g transform="translate(24, 55)">
        <rect width="480" height="64" rx="14" fill="#25262B" stroke="#894CFF" stroke-width="1"/>
        <text x="20" y="28" style="font-family: 'Inter', sans-serif; font-size: 13px; fill: #E3E2E6;">He detectado que tu BMW Serie 3 requiere cambio de</text>
        <text x="20" y="48" style="font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; fill: #D1BCFF;">filtro de aire en 1,200 km. ¿Deseas cotizarlo en Yonke?</text>
      </g>

      <!-- User Reply Bubble -->
      <g transform="translate(180, 135)">
        <rect width="412" height="50" rx="14" fill="#894CFF"/>
        <text x="20" y="31" style="font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; fill: #FFFFFF;">Sí, busca refacción Direct Fit con mejor precio.</text>
      </g>
    </g>

    <!-- Component 6: Docked Bottom Composer -->
    <g transform="translate(32, 960)">
      <rect width="616" height="70" rx="20" fill="#1B1B1F" stroke="#4A4455" stroke-opacity="0.4"/>
      <rect x="16" y="12" width="510" height="46" rx="23" fill="#25262B"/>
      <text x="40" y="40" style="font-family: 'Inter', sans-serif; font-size: 13px; fill: #A3AAC4;">Pregúntale a Zora sobre tu vehículo o refacción...</text>
      <circle cx="570" cy="35" r="22" fill="url(#brandGradient)"/>
      <path d="M565 35L575 35M570 30L575 35L570 40" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- COLUMNA 3: 6 MOBILE SCREENS BLUEPRINT (X=1500, Y=180, W=640)          -->
  <!-- ===================================================================== -->
  <g transform="translate(1500, 180)">
    <rect width="640" height="1160" rx="20" fill="#12151C" stroke="#4A4455" stroke-opacity="0.3"/>
    <text x="32" y="44" class="section-hdr">3. MOBILE APP SCREENS (390PX VIEWPORTS)</text>

    <!-- Mini Screen Matrix (2x3) -->
    <!-- Screen 00 -->
    <g transform="translate(32, 70)">
      <rect width="270" height="330" rx="16" fill="#0D0E11" stroke="#4A4455" stroke-opacity="0.4"/>
      <circle cx="135" cy="140" r="40" fill="url(#brandGradient)" opacity="0.3"/>
      <circle cx="135" cy="140" r="24" fill="url(#brandGradient)"/>
      <text x="65" y="210" style="font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 800; fill: #E3E2E6;">00. SPLASH IGNITION</text>
      <text x="50" y="230" class="subtitle">Arranque con halo de luz</text>
    </g>

    <!-- Screen 01 -->
    <g transform="translate(338, 70)">
      <rect width="270" height="330" rx="16" fill="#0D0E11" stroke="#4A4455" stroke-opacity="0.4"/>
      <rect x="20" y="20" width="230" height="32" rx="8" fill="#1B1B1F"/>
      <rect x="20" y="70" width="230" height="140" rx="12" fill="#1B1B1F"/>
      <text x="55" y="250" style="font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 800; fill: #E3E2E6;">01. EMPTY STATE</text>
      <text x="60" y="270" class="subtitle">Quick Prompt Chips</text>
    </g>

    <!-- Screen 02 -->
    <g transform="translate(32, 430)">
      <rect width="270" height="330" rx="16" fill="#0D0E11" stroke="#4A4455" stroke-opacity="0.4"/>
      <rect x="20" y="30" width="180" height="50" rx="10" fill="#1B1B1F"/>
      <rect x="70" y="90" width="180" height="40" rx="10" fill="#894CFF"/>
      <rect x="20" y="140" width="230" height="80" rx="10" fill="#1B1B1F"/>
      <text x="45" y="260" style="font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 800; fill: #E3E2E6;">02. ONBOARDING CHAT</text>
      <text x="55" y="280" class="subtitle">Priority Care Cards</text>
    </g>

    <!-- Screen 03 -->
    <g transform="translate(338, 430)">
      <rect width="270" height="330" rx="16" fill="#0D0E11" stroke="#4A4455" stroke-opacity="0.4"/>
      <rect x="20" y="30" width="230" height="80" rx="12" fill="#1B1B1F"/>
      <rect x="20" y="120" width="230" height="90" rx="12" fill="#1B1B1F"/>
      <text x="45" y="260" style="font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 800; fill: #E3E2E6;">03. GARAGE TELEMETRY</text>
      <text x="55" y="280" class="subtitle">Check-in de 30 segundos</text>
    </g>

    <!-- Screen 04 -->
    <g transform="translate(32, 790)">
      <rect width="270" height="330" rx="16" fill="#0D0E11" stroke="#4A4455" stroke-opacity="0.4"/>
      <rect x="20" y="30" width="230" height="40" rx="20" fill="#1B1B1F"/>
      <rect x="20" y="80" width="230" height="120" rx="12" fill="#1B1B1F"/>
      <text x="40" y="250" style="font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 800; fill: #E3E2E6;">04. PARTS INTELLIGENCE</text>
      <text x="70" y="270" class="subtitle">Yonke &amp; OEM Feed</text>
    </g>

    <!-- Screen 05 -->
    <g transform="translate(338, 790)">
      <rect width="270" height="330" rx="16" fill="#0D0E11" stroke="#4A4455" stroke-opacity="0.4"/>
      <rect x="20" y="30" width="230" height="130" rx="12" fill="#1B1B1F"/>
      <rect x="20" y="180" width="230" height="40" rx="20" fill="url(#brandGradient)"/>
      <text x="50" y="260" style="font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 800; fill: #E3E2E6;">05. ZORA PRO PAYWALL</text>
      <text x="65" y="280" class="subtitle">Multi-Agent Network</text>
    </g>
  </g>
</svg>
