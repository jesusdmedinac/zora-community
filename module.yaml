product:
  type: lib
  platforms: [android, iosArm64, iosSimulatorArm64, jvm, wasmJs]

settings:
  kotlin:
    serialization: json
    optIns:
      - kotlinx.coroutines.ExperimentalCoroutinesApi
      - kotlin.uuid.ExperimentalUuidApi

dependencies:
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.1
  - org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.0
  - org.jetbrains.kotlinx:kotlinx-datetime:0.6.2
  - app.cash.sqldelight:runtime:2.1.0
  - app.cash.sqldelight:coroutines-extensions:2.1.0
  - app.cash.sqldelight:primitive-adapters:2.1.0

dependencies@android:
  - app.cash.sqldelight:android-driver:2.1.0

dependencies@ios:
  - app.cash.sqldelight:native-driver:2.1.0

dependencies@jvm:
  - app.cash.sqldelight:sqlite-driver:2.1.0

dependencies@wasmJs:
  - app.cash.sqldelight:web-worker-driver:2.1.0
